<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Book Nest — Online Bookstore</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,sans-serif;background:#faf8f4;color:#171717;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.top{background:#171717;color:#fff;text-align:center;padding:8px;font-size:12px}.nav{height:72px;background:#fff;border-bottom:1px solid #e8e3db;display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:20}.logo{font-size:23px;font-weight:800;letter-spacing:-.04em}.logo span{color:#a66b3d}.links{display:flex;gap:26px;font-size:14px;color:#555}.links a:hover{color:#a66b3d}.actions{display:flex;gap:7px;align-items:center}.btn,.icon{border:0;border-radius:9px;padding:11px 15px}.btn{background:#171717;color:#fff;font-weight:700}.btn:hover{background:#333}.icon{background:#f0ede7;color:#171717}.danger{background:#b64035!important;color:#fff!important}.hero{padding:75px 7%;background:radial-gradient(circle at 82% 50%,#dfcdb9 0,transparent 30%),#f1e7dc}.hero small,.kicker{letter-spacing:.16em;font-weight:800;color:#a66b3d;font-size:11px}.hero h1{font-family:Georgia,serif;font-size:clamp(44px,7vw,78px);line-height:1.02;max-width:760px;margin:12px 0 22px;letter-spacing:-.05em}.hero em{color:#a66b3d}.hero p{font-size:18px;color:#666;max-width:630px}.section{padding:60px 5%}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.head h2,.section>h2{font-family:Georgia,serif;font-size:40px;line-height:1.05;margin:8px 0}.search{padding:12px;border:1px solid #ddd6cc;border-radius:9px;width:280px;background:#fff;outline:0}.chips{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.chip{border:1px solid #ddd6cc;background:#fff;border-radius:99px;padding:8px 14px;white-space:nowrap}.chip.active{background:#171717;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid #e5e0d8;border-radius:13px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px #0000000d}.cover{height:235px;display:grid;place-items:center;padding:25px;font-family:Georgia,serif;font-size:21px;text-align:center;background:#d1b79d;color:#fff}.info{padding:16px}.cat{font-size:10px;color:#a66b3d;text-transform:uppercase;letter-spacing:.12em}.info h3{margin:6px 0 2px;font-family:Georgia,serif;font-size:19px}.muted{color:#777;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}.price{font-weight:800}.old{text-decoration:line-through;color:#aaa;font-size:11px;margin-left:4px}.panel{background:#fff;border:1px solid #e5e0d8;border-radius:13px;padding:20px;margin-top:18px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #ddd6cc;border-radius:8px;outline:0;background:#fff}.full{grid-column:1/-1}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:13px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;border:1px solid #e5e0d8;border-radius:12px;background:#fff}.stat b{font-size:27px;display:block}.stat small{color:#777}.footer{background:#171717;color:#fff;padding:45px 5%;margin-top:20px}.footer p{color:#aaa;font-size:13px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:50;padding:15px}.modal.show{display:grid}.box{background:#fff;border-radius:15px;padding:25px;width:min(620px,100%);max-height:92vh;overflow:auto;position:relative}.close{position:absolute;right:14px;top:14px;border:0;background:#eee;width:35px;height:35px;border-radius:50%;font-size:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#171717;color:#fff;padding:12px 18px;border-radius:9px;display:none;z-index:100;font-size:13px}.toast.show{display:block}.empty{text-align:center;padding:45px;color:#777}.order{padding:15px 0;border-bottom:1px solid #eee}.mini-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}@media(max-width:800px){.links{display:none}.nav{padding:0 4%;height:65px}.logo{font-size:20px}.section{padding:42px 4%}.head{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:190px;font-size:16px}.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.full{grid-column:auto}.hero{padding:55px 5%}.hero p{font-size:15px}.hero h1{font-size:49px}.actions .icon{padding:9px}.actions .admin-link{display:none}}

.product-gallery{position:relative}.product-gallery .cover{height:235px}.product-gallery img{width:100%;height:235px;object-fit:cover;display:block}.thumbs{display:flex;gap:6px;padding:8px;overflow:auto;background:#fff}.thumbs img{width:42px;height:50px;object-fit:cover;border-radius:5px;border:1px solid #ddd;cursor:pointer}.photo-count{position:absolute;right:10px;top:10px;background:#171717;color:#fff;padding:5px 8px;border-radius:99px;font-size:11px}.upload-box{border:2px dashed #d6d0c8;border-radius:10px;padding:16px;background:#faf8f4}.upload-box input{padding:8px}.photo-preview{display:flex;gap:8px;overflow:auto;margin-top:10px}.photo-preview div{position:relative;flex:0 0 72px}.photo-preview img{width:72px;height:85px;object-fit:cover;border-radius:7px;border:1px solid #ddd}.photo-preview button{position:absolute;right:-4px;top:-5px;border:0;background:#b64035;color:#fff;border-radius:50%;width:22px;height:22px}
</style>

<body>
<div class="top">Free shipping on orders over ₹799 • 7-day easy returns</div>
<header class="nav">
  <a class="logo" href="#home">Book <span>Nest</span></a>
  <nav class="links"><a href="#home">Home</a><a href="#shop">Shop</a><a href="#account">Account</a><a href="#orders">Orders</a></nav>
  <div class="actions"><button class="icon" onclick="openAuth()">Account</button><button class="icon" onclick="showCart()">🛒 <b id="cartCount">0</b></button></div>
</header>

<main id="app"></main>
<footer class="footer"><b>Book Nest</b><p>Your modern destination for great books.</p><p>© 2026 Book Nest</p></footer>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div><div class="toast" id="toast"></div>

<script>
const KEY="book_nest_data_v1";
const defaultBooks=[
{id:1,title:"Atomic Habits",author:"James Clear",category:"Self Help",price:499,oldPrice:599,stock:25,rating:4.9,desc:"A practical guide to building good habits.",color:"#c99b5b"},
{id:2,title:"The Psychology of Money",author:"Morgan Housel",category:"Business",price:399,oldPrice:499,stock:18,rating:4.8,desc:"Timeless lessons on wealth and behavior.",color:"#29413e"},
{id:3,title:"The Alchemist",author:"Paulo Coelho",category:"Classics",price:299,oldPrice:349,stock:30,rating:4.7,desc:"A timeless story about following your dreams.",color:"#6d4b3b"},
{id:4,title:"Clean Code",author:"Robert C. Martin",category:"Technology",price:699,oldPrice:799,stock:12,rating:4.8,desc:"A handbook of agile software craftsmanship.",color:"#333a40"},
{id:5,title:"Wings of Fire",author:"A. P. J. Abdul Kalam",category:"Academic",price:329,oldPrice:399,stock:20,rating:4.9,desc:"An inspiring autobiography.",color:"#516b7b"},
{id:6,title:"The Silent Patient",author:"Alex Michaelides",category:"Fiction",price:379,oldPrice:449,stock:15,rating:4.6,desc:"A psychological thriller.",color:"#4b3540"}
];
let data;
try{
  data=JSON.parse(localStorage.getItem(KEY)||"null")||{books:defaultBooks,users:[],orders:[],currentUser:null};
}catch(e){
  data={books:defaultBooks,users:[],orders:[],currentUser:null};
}
data.books=Array.isArray(data.books)?data.books:defaultBooks;
data.users=Array.isArray(data.users)?data.users:[];
data.orders=Array.isArray(data.orders)?data.orders:[];
data.loginLockouts=data.loginLockouts||{};
data.adminProfile=data.adminProfile||null;
data.settings=Object.assign({
  siteName:"Book Nest",heroTitle:"Stories that stay with you.",
  heroText:"Discover handpicked fiction, self-help, business, technology and academic books — delivered to your door.",
  primaryFont:"Inter",headingFont:"Georgia",textSize:16,textColor:"#171717",
  accent:"#a66b3d",bg:"#faf8f4",heroSize:58,heroWeight:700,heroAlign:"left",
  payment:{cod:true,upi:true,card:true,upiId:""},shipping:799,
  loginLockout:{maxAttempts:5,minutes:15}
},data.settings||{});
data.settings.payment=Object.assign({cod:true,upi:true,card:true,upiId:""},data.settings.payment||{});
data.settings.loginLockout=Object.assign({maxAttempts:5,minutes:15},data.settings.loginLockout||{});
let cart;
try{cart=JSON.parse(localStorage.getItem("bn_cart")||"[]")}catch(e){cart=[]}
cart=Array.isArray(cart)?cart:[];
function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify(data));
    localStorage.setItem("bn_cart",JSON.stringify(cart));
  }catch(e){
    console.error(e);
    toast("Storage is full. Try fewer/smaller book photos.");
  }
  updateCount();
}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function toast(s){let x=document.getElementById("toast");x.textContent=s;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1900)}
function modal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()}
function updateCount(){document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.qty,0)}
function card(b){
const photos=b.photos||[], main=photos[0];
return `<article class="card"><div class="product-gallery">${main?`<img id="mainImg${b.id}" src="${main}" alt="${esc(b.title)}">`:`<div class="cover" style="background:${b.color||"#d1b79d"}">${(b.title||"BOOK").toUpperCase()}</div>`}${photos.length?`<span class="photo-count">📷 ${photos.length}</span>`:""}${photos.length>1?`<div class="thumbs">${photos.map((p,i)=>`<img src="${p}" alt="Photo ${i+1}" onclick="document.getElementById('mainImg${b.id}').src=this.src">`).join("")}</div>`:""}</div><div class="info"><span class="cat">${esc(b.category)}</span><h3>${esc(b.title)}</h3><div class="muted">${esc(b.author)}</div><div class="muted">★★★★★ ${b.rating||4.5} • Stock ${b.stock}</div><div class="row"><div class="price">${money(b.price)} <span class="old">${money(b.oldPrice)}</span></div><button class="btn" onclick="addCart(${b.id})">Add</button></div></div></article>`
}
function home(){document.getElementById("app").innerHTML=`<section class="hero"><small>YOUR NEXT GREAT READ</small><h1>${esc(data.settings.heroTitle)}</h1><p>${esc(data.settings.heroText)}</p><a class="btn" href="#shop">Explore Books →</a></section><section class="section"><div class="head"><div><span class="kicker">CURATED FOR YOU</span><h2>Popular books</h2></div></div><div class="grid">${data.books.slice(0,4).map(card).join("")}</div></section>`}
function shop(){document.getElementById("app").innerHTML=`<section class="section"><div class="head"><div><span class="kicker">SHOP</span><h2>All Books</h2></div><input class="search" id="search" placeholder="Search books or authors..."></div><div class="chips">${["All","Fiction","Self Help","Business","Technology","Academic","Classics"].map(c=>`<button class="chip ${c==="All"?"active":""}" onclick="filterShop('${c}',this)">${c}</button>`).join("")}</div><div class="grid" id="productGrid">${data.books.map(card).join("")}</div></section>`}
function filterShop(cat,el){document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));el.classList.add("active");renderShop(cat,document.getElementById("search").value)}
function renderShop(cat="All",q=""){let list=data.books.filter(b=>(cat==="All"||b.category===cat)&&(`${b.title} ${b.author}`.toLowerCase().includes(q.toLowerCase())));document.getElementById("productGrid").innerHTML=list.length?list.map(card).join(""):`<div class="empty full">No books found.</div>`;document.getElementById("search").oninput=e=>renderShop(cat,e.target.value)}
function addCart(id){let b=data.books.find(x=>x.id===id);if(!b||b.stock<1){toast("Book is out of stock");return}let x=cart.find(x=>x.id===id);if(x){if(x.qty>=b.stock)return toast("Stock limit reached");x.qty++}else cart.push({id,title:b.title,price:b.price,qty:1});persist();toast("Added to cart")}
function showCart(){
  cart=cart.filter(x=>data.books.some(b=>b.id===x.id));
  let total=cart.reduce((s,x)=>s+Number(x.price||0)*Number(x.qty||0),0);
  let items=cart.map((x,i)=>`<div class="order"><b>${x.title}</b><br>${money(x.price)} × ${x.qty}<div class="mini-actions"><button class="icon" onclick="changeQty(${i},-1)">−</button><button class="icon">${x.qty}</button><button class="icon" onclick="changeQty(${i},1)">+</button><button class="icon danger" onclick="removeCart(${i})">Remove</button></div></div>`).join("");
  modal(`<button class="close" onclick="closeModal()">×</button><h2>Shopping Cart</h2>${cart.length ? items+`<h3>Total: ${money(total)}</h3><button class="btn" onclick="checkout()">Checkout</button>` : `<div class="empty">Your cart is empty.</div>`}`);
}
function changeQty(i,d){
  let x=cart[i];if(!x)return;
  let b=data.books.find(y=>y.id===x.id);if(!b){cart.splice(i,1);persist();return showCart();}
  x.qty+=d;if(x.qty<=0)cart.splice(i,1);else if(x.qty>b.stock)x.qty=b.stock;
  persist();showCart();
}
function removeCart(i){cart.splice(i,1);persist();showCart()}
function openAuth(){
  if(data.currentUser){
    const isAdmin=data.currentUser.role==="admin";
    modal(`<button class="close" onclick="closeModal()">×</button><h2>${isAdmin?"Admin Account":"My Account"}</h2><p>You are logged in as <b>${esc(data.currentUser.name||"User")}</b>.</p><button class="btn" onclick="closeModal();${isAdmin?"adminProfile()":"location.hash='account'"}">Open Account</button> <button class="icon" onclick="logout()">Logout</button>`);
    return;
  }
  modal(`<button class="close" onclick="closeModal()">×</button><h2>Login to Book Nest</h2><p class="muted">For your security, repeated incorrect passwords temporarily lock the login.</p><div class="form"><input id="loginEmail" type="email" placeholder="Email"><input id="loginPass" type="password" placeholder="Password"><button class="btn full" onclick="login()">Login</button></div><p>New customer? <button class="icon" onclick="registerForm()">Create account</button></p><hr>`);
}
function registerForm(){modal(`<button class="close" onclick="closeModal()">×</button><h2>Create your account</h2><div class="form"><input id="rName" placeholder="Full name"><input id="rEmail" type="email" placeholder="Email"><input id="rPhone" placeholder="Mobile number"><input id="rPass" type="password" placeholder="Password"><button class="btn full" onclick="register()">Create Account</button></div>`)}
function register(){let name=rName.value,email=rEmail.value.toLowerCase(),phone=rPhone.value,pass=rPass.value;if(!name||!email||!pass)return toast("Fill all required fields");if(data.users.some(u=>u.email===email))return toast("Email already registered");let u={id:Date.now(),name,email,phone,password:pass,role:"user",addresses:[]};data.users.push(u);data.currentUser={...u,password:undefined};persist();closeModal();toast("Account created")}
function login(){
  const email=(document.getElementById("loginEmail")?.value||"").trim().toLowerCase();
  const pass=document.getElementById("loginPass")?.value||"";
  if(!email||!pass)return toast("Enter email and password");

  const locked=getLock(email);
  if(locked&&locked.lockedUntil)return toast(lockMessage(locked));

  if(email==="dineshkushwaha0933@gmail.com"&&pass==="Dinesh@*12344321#"){
    clearLoginFailures(email);
    data.currentUser={id:0,name:(data.adminProfile&&data.adminProfile.name)||"Book Nest Admin",email,role:"admin"};
    persist();closeModal();toast("Admin login successful");location.hash="admin";return;
  }

  const u=data.users.find(x=>x.email===email&&x.password===pass);
  if(!u){
    const x=registerFailedLogin(email);
    if(x.lockedUntil)return toast(lockMessage(x));
    const max=Number(data.settings.loginLockout.maxAttempts||5);
    return toast("Invalid email or password. "+Math.max(0,max-x.attempts)+" attempt"+(max-x.attempts===1?"":"s")+" left.");
  }
  clearLoginFailures(email);
  data.currentUser={id:u.id,name:u.name,email:u.email,phone:u.phone,role:u.role};
  persist();closeModal();toast("Welcome back");
}
function account(){if(!data.currentUser)return openAuth();if(data.currentUser.role==="admin"){adminProfile();return}let u=data.currentUser;document.getElementById("app").innerHTML=`<section class="section"><span class="kicker">MY ACCOUNT</span><h2>Welcome, ${esc(u.name||"Reader")}</h2><div class="panel"><div class="form"><label>Name<input id="aName" value="${u.name||""}"></label><label>Email<input value="${u.email||""}" disabled></label><label>Mobile<input id="aPhone" value="${u.phone||""}"></label><label>City/State<input id="aCity" placeholder="Optional"></label><label class="full">Address<input id="aAddress" placeholder="Saved delivery address"></label><button class="btn full" onclick="saveAccount()">Save Account Details</button></div></div><div class="panel"><button class="btn" onclick="location.hash='orders'">My Orders</button> <button class="icon" onclick="location.hash='home'">← Home</button> <button class="icon" onclick="logout()">Logout</button></div></section>`}
function saveAccount(){data.currentUser.name=aName.value;data.currentUser.phone=aPhone.value;let u=data.users.find(x=>x.id===data.currentUser.id);if(u){u.name=aName.value;u.phone=aPhone.value}persist();toast("Account details saved")}
function logout(){data.currentUser=null;persist();toast("Logged out");location.hash="home"}
function checkout(){if(!data.currentUser)return openAuth();let total=cart.reduce((s,x)=>s+x.price*x.qty,0);modal(`<button class="close" onclick="closeModal()">×</button><h2>Checkout</h2><p>Total: <b>${money(total)}</b></p><div class="form"><input id="cName" placeholder="Full name" value="${data.currentUser.name||""}"><input id="cPhone" placeholder="Mobile number" value="${data.currentUser.phone||""}"><input id="cAddress" class="full" placeholder="Full address"><input id="cCity" placeholder="City"><input id="cState" placeholder="State"><input id="cPin" placeholder="PIN code"><select id="payment" onchange="document.getElementById('upiInfo')?.remove();if(this.value==='UPI'&&data.settings.payment.upiId){this.insertAdjacentHTML('afterend','<small id="upiInfo" class="muted">Pay to UPI ID: '+esc(data.settings.payment.upiId)+'</small>')}">${paymentOptions()}</select><button class="btn full" onclick="placeOrder()">Place Order • ${money(total)}</button></div>`)}
function placeOrder(){let total=cart.reduce((s,x)=>s+x.price*x.qty,0);if(!cName.value||!cPhone.value||!cAddress.value||!cPin.value)return toast("Complete delivery details");let o={id:"BN"+Date.now().toString().slice(-8),userId:data.currentUser.id,items:cart.map(x=>({...x})),total,address:{name:cName.value,phone:cPhone.value,line1:cAddress.value,city:cCity.value,state:cState.value,pin:cPin.value},payment:payment.value,status:"Placed",date:new Date().toLocaleString("en-IN")};data.orders.unshift(o);cart.forEach(x=>{let b=data.books.find(y=>y.id===x.id);if(b)b.stock=Math.max(0,b.stock-x.qty)});cart=[];persist();closeModal();toast("Order placed successfully");location.hash="orders"}
function orders(){if(!data.currentUser)return openAuth();let os=data.orders.filter(o=>o.userId===data.currentUser.id);document.getElementById("app").innerHTML=`<section class="section"><span class="kicker">ORDERS</span><h2>My Orders</h2><div class="panel">${os.length?os.map(o=>`<div class="order"><b>Order #${o.id}</b> • ${o.date}<br>Total: <b>${money(o.total)}</b> • Status: <b>${o.status}</b><br><span class="muted">${o.items.map(x=>x.title+" × "+x.qty).join(", ")}</span></div>`).join(""):`<div class="empty">No orders yet.</div>`}</div></section>`}
function admin(){if(!data.currentUser||data.currentUser.role!=="admin")return openAuth();let sales=data.orders.reduce((s,o)=>s+o.total,0);document.getElementById("app").innerHTML=`<section class="section"><span class="kicker">ADMIN PANEL</span><h2>Book Nest Dashboard</h2><div class="stats"><div class="stat"><b>${data.books.length}</b><small>Products</small></div><div class="stat"><b>${data.users.length}</b><small>Customers</small></div><div class="stat"><b>${data.orders.length}</b><small>Orders</small></div><div class="stat"><b>${money(sales)}</b><small>Total Sales</small></div></div><div class="panel"><button class="btn" onclick="productForm()">+ Add New Book</button> <button class="icon" onclick="adminSettings()">⚙ Store & Payment Settings</button> <button class="icon" onclick="adminProfile()">👤 Admin Account Details</button><div class="table-wrap"><table class="table"><tr><th>Book</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>${data.books.map(b=>`<tr><td>${b.title}<br><small>${b.author}</small></td><td>${b.category}</td><td>${money(b.price)}</td><td>${b.stock}</td><td><button class="icon" onclick="productForm(${b.id})">Edit</button> <button class="icon danger" onclick="deleteProduct(${b.id})">Delete</button></td></tr>`).join("")}</table></div></div><div class="panel"><h3>Recent Orders</h3>${data.orders.slice(0,10).map(o=>`<div class="order"><b>${o.id}</b> — ${money(o.total)} — ${o.status}<button class="icon" style="float:right" onclick="changeOrder('${o.id}')">Update</button></div>`).join("")||"No orders"}</div></section>`}
function productForm(id){
if(!data.currentUser||data.currentUser.role!=="admin")return openAuth();
let b=id?data.books.find(x=>x.id===id):{}; editingPhotos=[...(b.photos||[])];
modal(`<button class="close" onclick="closeModal()">×</button><h2>${id?"Edit":"Add"} Book</h2><div class="form">
<input id="pTitle" placeholder="Book title" value="${esc(b.title||"")}">
<input id="pAuthor" placeholder="Author" value="${esc(b.author||"")}">
<input id="pCat" placeholder="Category" value="${esc(b.category||"")}">
<input id="pPrice" type="number" placeholder="Price" value="${b.price||""}">
<input id="pOld" type="number" placeholder="Old price" value="${b.oldPrice||""}">
<input id="pStock" type="number" placeholder="Stock" value="${b.stock??0}">
<input id="pColor" placeholder="Cover color" value="${b.color||"#a66b3d"}">
<div class="upload-box"><b>📸 Add Book Photos — Admin Only</b><p class="photo-help">Upload up to 8 photos: front, back, inside pages, edges and condition. Customers can only view them.</p><input id="pPhotos" type="file" accept="image/*" multiple onchange="handlePhotos(this)"><div id="photoPreview" class="photo-preview">${(b.photos||[]).map((p,i)=>`<div><img src="${p}"><button type="button" onclick="editingPhotos.splice(${i},1);renderPhotoPreview()">×</button></div>`).join("")}</div></div>
<textarea id="pDesc" class="full" placeholder="Description / condition">${esc(b.desc||"")}</textarea>
<button class="btn full" onclick="saveProduct(${id||0})">Save Book</button></div>`)
}


let editingPhotos=[];
function handlePhotos(input){
  const files=[...input.files];
  if(files.length>8){toast("Maximum 8 photos allowed");input.value="";return}
  editingPhotos=[];
  files.forEach(file=>{
    if(!file.type.startsWith("image/"))return;
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=1100, scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        editingPhotos.push(c.toDataURL("image/jpeg",.78)); renderPhotoPreview();
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function renderPhotoPreview(){
  const el=document.getElementById("photoPreview");if(!el)return;
  el.innerHTML=editingPhotos.map((p,i)=>`<div><img src="${p}"><button type="button" onclick="editingPhotos.splice(${i},1);renderPhotoPreview()">×</button></div>`).join("");
}

function previewPhotos(input){
  const files=[...input.files];
  const max=8;
  if(files.length>max){toast("Maximum 8 photos allowed");input.value="";return}
  editingPhotos=[];
  let done=0;
  files.forEach(file=>{
    if(!file.type.startsWith("image/")) return;
    const reader=new FileReader();
    reader.onload=e=>{editingPhotos.push(e.target.result);done++;renderPhotoPreview();};
    reader.readAsDataURL(file);
  });
}

function saveProduct(id){
  let old=id?data.books.find(x=>x.id===id):{};
  const title=document.getElementById("pTitle").value.trim();
  const author=document.getElementById("pAuthor").value.trim();
  const category=document.getElementById("pCat").value.trim()||"General";
  const price=Number(document.getElementById("pPrice").value);
  const oldPrice=Number(document.getElementById("pOld").value)||price;
  const stock=Number(document.getElementById("pStock").value)||0;
  const color=document.getElementById("pColor").value||"#a66b3d";
  const desc=document.getElementById("pDesc").value;
  if(!title||!price)return toast("Title and price are required");
  const b={id:id||Date.now(),title,author,category,price,oldPrice,stock,rating:old.rating||4.5,color,desc,photos:[...(editingPhotos||[])]};
  if(id){const i=data.books.findIndex(x=>x.id===id);if(i<0)return toast("Book not found");data.books[i]=b}else data.books.push(b);
  persist();closeModal();toast("Book saved");location.hash="admin";
}
function deleteProduct(id){if(!confirm("Delete this product?"))return;data.books=data.books.filter(x=>x.id!==id);cart=cart.filter(x=>x.id!==id);persist();toast("Product deleted");location.hash="admin"}
function changeOrder(id){let o=data.orders.find(x=>x.id===id);let s=prompt("Status: Placed / Packed / Shipped / Delivered / Cancelled",o.status);if(s){o.status=s;persist();toast("Order updated");location.hash="admin"}}

  data.settings.textColor=setTextColor.value||"#171717";

function applySettings(){
  const s=data.settings||{};
  document.body.style.removeProperty("font-family");
  document.body.style.removeProperty("font-size");
  document.body.style.removeProperty("color");
  document.querySelectorAll("body *").forEach(el=>{
    el.style.removeProperty("font-family");
    el.style.removeProperty("font-size");
    el.style.removeProperty("color");
  });
  document.documentElement.style.removeProperty("--accent");
  document.documentElement.style.removeProperty("--page-bg");

  // Original Book Nest typography
  document.body.style.fontFamily="Inter,Arial,sans-serif";
  document.body.style.color="#171717";
  document.querySelectorAll("h1,h2,h3,h4,h5,h6,.hero h1,.logo").forEach(el=>{
    el.style.fontFamily="Georgia,serif";
  });
  document.querySelectorAll(".kicker,.hero small,.cat").forEach(x=>{
    x.style.color="#a66b3d";
  });
}
function saveLockoutSettings(){
  data.settings.loginLockout={
    maxAttempts:Math.min(10,Math.max(3,Number(lockAttempts.value)||5)),
    minutes:Math.min(1440,Math.max(1,Number(lockMinutes.value)||15))
  };
  persist();toast("Login lockout settings saved");adminSettings();
}
function lockKey(email){return String(email||"").trim().toLowerCase()}
function getLock(email){
  const k=lockKey(email), now=Date.now(), x=data.loginLockouts[k];
  if(!x)return null;
  if(x.lockedUntil && x.lockedUntil>now)return x;
  if(x.lockedUntil && x.lockedUntil<=now){delete data.loginLockouts[k];persist();return null}
  return x;
}
function registerFailedLogin(email){
  const k=lockKey(email), now=Date.now(), cfg=data.settings.loginLockout||{maxAttempts:5,minutes:15};
  const x=data.loginLockouts[k]||{attempts:0};
  x.attempts++;
  if(x.attempts>=Number(cfg.maxAttempts||5))x.lockedUntil=now+Number(cfg.minutes||15)*60000;
  data.loginLockouts[k]=x;persist();return x;
}
function clearLoginFailures(email){delete data.loginLockouts[lockKey(email)];persist()}
function lockMessage(x){
  if(!x||!x.lockedUntil)return "";
  const mins=Math.max(1,Math.ceil((x.lockedUntil-Date.now())/60000));
  return "Too many failed login attempts. Try again in "+mins+" minute"+(mins===1?"":"s")+".";
}
function paymentOptions(){

            (p.upi?'<option>UPI</option>':'')+
            (p.card?'<option>Card</option>':'');
  return out||'<option>Cash on Delivery</option>';
}
